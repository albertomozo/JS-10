<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Navegación y Filtrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border-color: #ff6b6b;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .articles-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .materias {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            opacity: 1;
            transform: scale(1);
            position: relative;
        }

        .materias:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .materias.hidden {
            display: none;
        }

        .materias h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.4rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .materias .subject {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .materias p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .materias .precio {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .materias .url-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .materias .url-link:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
            transform: translateY(-2px);
        }

        .tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .categoria-1 {
            border-left: 5px solid #3498db;
        }

        .categoria-1 .tag {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .categoria-2 {
            border-left: 5px solid #e74c3c;
        }

        .categoria-2 .tag {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        .categoria-3 {
            border-left: 5px solid #f39c12;
        }

        .categoria-3 .tag {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .categoria-4 {
            border-left: 5px solid #9b59b6;
        }

        .categoria-4 .tag {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
            color: white;
        }

        .categoria-5 {
            border-left: 5px solid #1abc9c;
        }

        .categoria-5 .tag {
            background: linear-gradient(45deg, #1abc9c, #16a085);
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .navigation {
                gap: 10px;
            }
            
            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .articles-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio de Desarrollo</h1>
        
        <nav class="navigation" id="navigation">
            <!-- Los botones se generarán dinámicamente -->
        </nav>

        <div class="articles-container" id="articles-container">
            <!-- Los artículos se generarán dinámicamente -->
        </div>
    </div>

    <script>
        // Datos de materias
        const manuales = {
            materias: [
                {
                    "id": 1,
                    "materia": "HTML",
                    "nombre": "HTML Básico",
                    "url": 'https://docs.google.com/presentation/d/1KfPKrD9dmRxfIlOQ9hdRaeayiibZQ7jZJXq_qWlHOTA/edit?usp=sharing',
                    "imagen": "html.svg",
                    "categoria": "1",
                    "tipo": 'drive',
                    "precio": 10
                },
                {
                    "id": 2,
                    "materia": "JS",
                    "nombre": "JS básico",
                    "url": 'https://docs.google.com/presentation/d/1rTIUbxueAOxUOdXNKrYtGgCswSCpzSENOLpReap8E5A/edit?usp=sharing',
                    "imagen": "js.svg",
                    "categoria": "1",
                    "precio": 15
                },
                {
                    "id": 3,
                    "nombre": "SASS 1",
                    "materia": "SASS",
                    "url": 'https://docs.google.com/presentation/d/1Lr8MJz9VN-TjAu0dqOe5RsJiwO0VYG60XxWZGZLq7oo/edit?usp=sharing',
                    "imagen": "sass.svg",
                    "categoria": "1",
                    "precio": 13
                },
                {
                    "id": 4,
                    "nombre": "PHP 1",
                    "materia": "PHP",
                    "url": 'https://docs.google.com/presentation/d/13540h_unETM2xycZFKPBPPfpwRo9UO1vdqnS2zi4gUo/edit?usp=sharing',
                    "imagen": "php.svg",
                    "categoria": "2",
                    "precio": 17
                },
                {
                    "id": 5,
                    "nombre": "GIT 1",
                    "materia": "GIT",
                    "url": 'https://docs.google.com/presentation/d/1v8LjvzaJVrzTUrp3jUhqi79V3jjB4E90blN_RDNsxIo/edit?usp=sharing',
                    "imagen": "Git_logo_PNG2.png",
                    "categoria": "3",
                    "precio": 21
                },
                {
                    "id": 6,
                    "nombre": "SUBVERSION , GIT",
                    "materia": "Control de Versiones",
                    "url": 'https://docs.google.com/presentation/d/1v8LjvzaJVrzTUrp3jUhqi79V3jjB4E90blN_RDNsxIo/edit?usp=sharing',
                    "imagen": "Git_logo_PNG2.png",
                    "categoria": "3",
                    "precio": 21
                },
                {
                    "id": 7,
                    "nombre": "Introducción a la programación",
                    "materia": "PROGRAMACION",
                    "url": 'https://docs.google.com/presentation/d/1aROfBbbREKcBomYTxCqR41YfFoJGpfrRsuevn5tVs7o/edit#slide=id.p',
                    "imagen": "programacion.png",
                    "categoria": "5",
                    "precio": 12
                },
                {
                    "id": 8,
                    "nombre": "Postgres",
                    "materia": "BD",
                    "url": 'https://docs.google.com/presentation/d/1AQjwhDVbJLop8CXTaiO7Zpbz0u1aFJGyBqUODDPr0k4/edit?usp=sharing',
                    "imagen": "programacion.png",
                    "categoria": "2",
                    "precio": 65
                }
            ]
        };

        // Datos de categorías
        const categorias = {
            categoria: [
                {
                    id: 1,
                    nombre: "FrontEnd",
                    icono: "assets/img/categorias/front.svg",
                    descripcion: "Diseño visual, incluyendo animaciones"
                },
                {
                    id: 2,
                    nombre: "Back",
                    icono: "assets/img/categorias/back.svg",
                    descripcion: "Datos, programación en el servidor"
                },
                {
                    id: 3,
                    nombre: "Herramientas",
                    icono: "assets/img/categorias/herramientas.svg",
                    descripcion: "Aplicaciones para mejorar la productividad"
                },
                {
                    id: 4,
                    nombre: "Nocode",
                    icono: "assets/img/categorias/nocode.svg",
                    descripcion: "Plataformas para 'programar sin código'"
                },
                {
                    id: 5,
                    nombre: "Otros",
                    icono: "assets/img/categorias/ofimatica.svg",
                    descripcion: "Informática básica, programación, Sistemas, Ofimática..."
                }
            ]
        };

        const baseDeDatos = manuales.materias;

        // Función para generar los botones de navegación
        function generarNavegacion() {
            const navigation = document.getElementById('navigation');
            
            // Botón "Todos"
            const btnTodos = document.createElement('button');
            btnTodos.className = 'nav-btn active';
            btnTodos.id = 'todos';
            btnTodos.textContent = 'Todos';
            btnTodos.onclick = () => filtrarArticulos('todos');
            navigation.appendChild(btnTodos);

            // Botones de categorías dinámicos
            categorias.categoria.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `categoria-${cat.id}`;
                btn.textContent = cat.nombre;
                btn.onclick = () => filtrarArticulos(cat.id.toString());
                navigation.appendChild(btn);
            });
        }

        // Función para encontrar el nombre de la categoría
        function obtenerNombreCategoria(categoriaId) {
            const categoria = categorias.categoria.find(cat => cat.id.toString() === categoriaId);
            return categoria ? categoria.nombre : 'Categoría';
        }

        // Función para generar las fichas de productos
        function generarFichas() {
            const container = document.getElementById('articles-container');
            
            baseDeDatos.forEach(materia => {
                const article = document.createElement('article');
                article.className = `materias categoria-${materia.categoria}`;
                article.dataset.categoria = materia.categoria;

                const nombreCategoria = obtenerNombreCategoria(materia.categoria);

                article.innerHTML = `
                    <div class="precio">€${materia.precio}</div>
                    <h3>${materia.nombre}</h3>
                    <div class="subject">${materia.materia}</div>
                    <p>Material didáctico sobre ${materia.materia.toLowerCase()}. Incluye conceptos fundamentales y ejercicios prácticos para dominar esta tecnología.</p>
                    <a href="${materia.url}" target="_blank" class="url-link">Ver Material</a>
                    <br><br>
                    <span class="tag">${nombreCategoria}</span>
                `;

                container.appendChild(article);
            });
        }

        // Función para filtrar artículos
        function filtrarArticulos(categoria) {
            // Remover clase active de todos los botones
            const botones = document.querySelectorAll('.nav-btn');
            botones.forEach(btn => btn.classList.remove('active'));
            
            // Agregar clase active al botón clickeado
            if (categoria === 'todos') {
                document.getElementById('todos').classList.add('active');
            } else {
                document.getElementById(`categoria-${categoria}`).classList.add('active');
            }
            
            // Obtener todos los artículos
            const articulos = document.querySelectorAll('.materias');
            
            // Mostrar u ocultar artículos según la categoría
            articulos.forEach(articulo => {
                if (categoria === 'todos') {
                    articulo.classList.remove('hidden');
                } else {
                    if (articulo.dataset.categoria === categoria) {
                        articulo.classList.remove('hidden');
                    } else {
                        articulo.classList.add('hidden');
                    }
                }
            });
        }

        // Inicializar la aplicación cuando el DOM esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            generarNavegacion();
            generarFichas();
        });
    </script>
</body>
</html>
